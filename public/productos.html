<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POSLite — Productos</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="css/estilo.css" rel="stylesheet">
<style>
    table.tabla-productos { font-size: 0.9rem; }
    table.tabla-productos th {
        font-weight: 600;
        color: var(--ink-soft);
        font-size: 0.78rem;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
    }
    table.tabla-productos td {
        vertical-align: middle;
        border-bottom: 1px solid var(--border);
    }
</style>
</head>
<body data-pagina="productos">

<div id="app-nav"></div>

<main class="container-fluid py-4">
    <div class="row g-4">

        <!-- Formulario de creación -->
        <div class="col-12 col-lg-4">
            <div class="panel">
                <h2>Nuevo producto</h2>
                <form id="form-crear">
                    <div class="mb-2">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="c-nombre" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Categoría</label>
                        <select class="form-select" id="c-categoria" required></select>
                        <div class="form-text">
                            ¿No aparece la que buscas? <a href="categorias.html">Crea una categoría nueva</a>.
                        </div>
                    </div>
                    <div class="row g-2">
                        <div class="col-6 mb-2">
                            <label class="form-label">Unidad de venta</label>
                            <select class="form-select" id="c-unidad">
                                <option value="kg">Kilogramo (kg)</option>
                                <option value="unidad">Unidad</option>
                            </select>
                        </div>
                        <div class="col-6 mb-2">
                            <label class="form-label">Controla inventario</label>
                            <select class="form-select" id="c-controla">
                                <option value="1">Sí</option>
                                <option value="0">No (ej. caldosa, empaque)</option>
                            </select>
                        </div>
                    </div>
                    <div class="row g-2">
                        <div class="col-6 mb-2">
                            <label class="form-label">Precio de costo (₡)</label>
                            <input type="number" class="form-control" id="c-costo" min="0" required>
                        </div>
                        <div class="col-6 mb-2">
                            <label class="form-label">Precio de venta (₡)</label>
                            <input type="number" class="form-control" id="c-venta" min="0" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Stock mínimo (en unidad mínima: gramos o unidades)</label>
                        <input type="number" class="form-control" id="c-stock-minimo" min="0" value="0">
                    </div>
                    <button type="submit" class="btn btn-accent w-100">Crear producto</button>
                    <div class="estado-mensaje mt-2" id="c-estado"></div>
                </form>
            </div>
        </div>

        <!-- Tabla de productos -->
        <div class="col-12 col-lg-8">
            <div class="panel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="mb-0">Productos</h2>
                    <button class="btn btn-sm btn-outline-secondary" id="btn-recargar">Recargar</button>
                </div>
                <div class="table-responsive">
                    <table class="table tabla-productos">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Categoría</th>
                                <th>Unidad</th>
                                <th>Precio venta</th>
                                <th>Stock mín.</th>
                                <th>Estado</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="tbody-productos"></tbody>
                    </table>
                    <div class="vacio d-none" id="tabla-vacia">Aún no hay productos registrados.</div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Modal simple para editar precio -->
<div class="modal fade" id="modalPrecio" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Cambiar precio de venta</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="mp-id">
                <label class="form-label">Nuevo precio (₡)</label>
                <input type="number" class="form-control" id="mp-precio" min="0">
                <label class="form-label mt-2" for="mp-motivo">Motivo del cambio</label>
                <input type="text" class="form-control" id="mp-motivo" maxlength="200" placeholder="Ej. cambio del proveedor" required>
                <div class="estado-mensaje mt-2" id="mp-estado"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-accent w-100" id="mp-guardar">Guardar</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalEditarProducto" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Editar producto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="form-editar-producto">
                <div class="modal-body">
                    <input type="hidden" id="ep-id">
                    <label class="form-label" for="ep-nombre">Nombre</label>
                    <input type="text" class="form-control mb-2" id="ep-nombre" required maxlength="120">
                    <label class="form-label" for="ep-categoria">Categoría</label>
                    <select class="form-select mb-2" id="ep-categoria" required></select>
                    <label class="form-label" for="ep-costo">Precio de costo (₡)</label>
                    <input type="number" class="form-control mb-2" id="ep-costo" min="0" step="1" required>
                    <label class="form-label" for="ep-stock-minimo">Stock mínimo</label>
                    <input type="number" class="form-control" id="ep-stock-minimo" min="0" step="1" required>
                    <div class="form-text mt-2">La unidad de venta no se puede cambiar después de registrar movimientos.</div>
                    <div class="estado-mensaje mt-2" id="ep-estado"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-accent w-100" type="submit">Guardar cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/nav.js"></script>
<script>
const API_BASE = '/api';

let CATEGORIAS = [];
let productosCargados = [];

async function cargarCategoriasEnSelect() {
    const select = document.getElementById('c-categoria');
    try {
        const respuesta = await fetch(`${API_BASE}/categorias`);
        CATEGORIAS = await respuesta.json();

        if (CATEGORIAS.length === 0) {
            select.innerHTML = '<option value="">No hay categorías — crea una primero</option>';
            return;
        }

        select.innerHTML = CATEGORIAS
            .map(cat => `<option value="${cat.id}">${cat.nombre}</option>`)
            .join('');
    } catch (error) {
        select.innerHTML = '<option value="">No se pudo cargar categorías</option>';
    }
}

function nombreCategoria(id) {
    const cat = CATEGORIAS.find(c => c.id === id);
    return cat ? cat.nombre : '—';
}

function formatoColones(valor) {
    return '₡' + Number(valor).toLocaleString('es-CR');
}

async function cargarProductos() {
    const tbody = document.getElementById('tbody-productos');
    const vacio = document.getElementById('tabla-vacia');

    try {
        const respuesta = await fetch(`${API_BASE}/productos`);
        const productos = await respuesta.json();
        productosCargados = productos;

        if (productos.length === 0) {
            tbody.innerHTML = '';
            vacio.classList.remove('d-none');
            return;
        }
        vacio.classList.add('d-none');

        tbody.innerHTML = productos.map(p => `
            <tr>
                <td>${p.nombre}</td>
                <td>${nombreCategoria(p.categoria_id)}</td>
                <td>${p.unidad_venta}</td>
                <td>${formatoColones(p.precio_venta)}</td>
                <td>${p.stock_minimo}</td>
                <td>
                    <span class="${p.activo ? 'badge-activo' : 'badge-inactivo'}">
                        ${p.activo ? 'Activo' : 'Inactivo'}
                    </span>
                </td>
                <td class="text-end">
                    <button class="btn btn-sm btn-outline-secondary" onclick="abrirModalPrecio(${p.id}, ${p.precio_venta})">
                        Precio
                    </button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="verHistorialPrecios(${p.id}, '${String(p.nombre).replace(/'/g, '&#039;')}')">
                        Historial
                    </button>
                    <button class="btn btn-sm btn-outline-primary" onclick="abrirModalEditar(${p.id})">
                        Editar
                    </button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="alternarActivo(${p.id}, ${p.activo})">
                        ${p.activo ? 'Desactivar' : 'Activar'}
                    </button>
                </td>
            </tr>
        `).join('');

    } catch (error) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-3">
            No se pudo conectar con el servidor (${error.message}).
        </td></tr>`;
    }
}

document.getElementById('form-crear').addEventListener('submit', async (evento) => {
    evento.preventDefault();
    const estado = document.getElementById('c-estado');
    estado.textContent = 'Guardando...';
    estado.className = 'estado-mensaje mt-2 text-muted';

    const producto = {
        nombre: document.getElementById('c-nombre').value,
        categoria_id: Number(document.getElementById('c-categoria').value),
        unidad_venta: document.getElementById('c-unidad').value,
        controla_inventario: Number(document.getElementById('c-controla').value),
        precio_costo: Number(document.getElementById('c-costo').value),
        precio_venta: Number(document.getElementById('c-venta').value),
        stock_minimo: Number(document.getElementById('c-stock-minimo').value),
    };

    try {
        const respuesta = await fetch(`${API_BASE}/productos`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(producto)
        });

        if (!respuesta.ok) throw new Error('El servidor respondió con un error');

        estado.textContent = 'Producto creado.';
        estado.className = 'estado-mensaje mt-2 text-success';
        document.getElementById('form-crear').reset();
        cargarProductos();
        setTimeout(() => {
            if (estado.classList.contains('text-success')) estado.textContent = '';
        }, 3000);

    } catch (error) {
        estado.textContent = `No se pudo crear: ${error.message}`;
        estado.className = 'estado-mensaje mt-2 text-danger';
    }
});

document.getElementById('btn-recargar').addEventListener('click', () => {
    cargarCategoriasEnSelect();
    cargarProductos();
});

const modalPrecio = new bootstrap.Modal(document.getElementById('modalPrecio'));
const modalEditarProducto = new bootstrap.Modal(document.getElementById('modalEditarProducto'));

function abrirModalEditar(id) {
    const producto = productosCargados.find(item => item.id === Number(id));
    if (!producto) return;

    document.getElementById('ep-id').value = producto.id;
    document.getElementById('ep-nombre').value = producto.nombre;
    document.getElementById('ep-categoria').innerHTML = CATEGORIAS
        .map(categoria => `<option value="${categoria.id}">${categoria.nombre}</option>`)
        .join('');
    document.getElementById('ep-categoria').value = producto.categoria_id;
    document.getElementById('ep-costo').value = producto.precio_costo;
    document.getElementById('ep-stock-minimo').value = producto.stock_minimo;
    document.getElementById('ep-estado').textContent = '';
    modalEditarProducto.show();
}

document.getElementById('form-editar-producto').addEventListener('submit', async evento => {
    evento.preventDefault();
    const estado = document.getElementById('ep-estado');
    estado.className = 'estado-mensaje mt-2 text-muted';
    estado.textContent = 'Guardando...';

    try {
        const id = document.getElementById('ep-id').value;
        const respuesta = await fetch(`${API_BASE}/productos/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                nombre: document.getElementById('ep-nombre').value.trim(),
                categoria_id: Number(document.getElementById('ep-categoria').value),
                precio_costo: Number(document.getElementById('ep-costo').value),
                stock_minimo: Number(document.getElementById('ep-stock-minimo').value)
            })
        });
        const datos = await respuesta.json();
        if (!respuesta.ok) throw new Error(datos.error || 'No se pudo actualizar el producto');
        modalEditarProducto.hide();
        cargarProductos();
    } catch (error) {
        estado.className = 'estado-mensaje mt-2 text-danger';
        estado.textContent = error.message;
    }
});

function abrirModalPrecio(id, precioActual) {
    document.getElementById('mp-id').value = id;
    document.getElementById('mp-precio').value = precioActual;
    document.getElementById('mp-motivo').value = '';
    document.getElementById('mp-estado').textContent = '';
    modalPrecio.show();
}

document.getElementById('mp-guardar').addEventListener('click', async () => {
    const id = document.getElementById('mp-id').value;
    const nuevoPrecio = Number(document.getElementById('mp-precio').value);
    const motivo = document.getElementById('mp-motivo').value.trim();
    const estado = document.getElementById('mp-estado');
    if (!motivo) {
        estado.className = 'estado-mensaje mt-2 text-danger';
        estado.textContent = 'Indica el motivo del cambio.';
        return;
    }

    const respuesta = await fetch(`${API_BASE}/productos/${id}/precio`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ precio_venta: nuevoPrecio, motivo })
    });
    const datos = await respuesta.json();
    if (!respuesta.ok) {
        estado.className = 'estado-mensaje mt-2 text-danger';
        estado.textContent = datos.error || 'No se pudo cambiar el precio.';
        return;
    }

    modalPrecio.hide();
    cargarProductos();
});

async function verHistorialPrecios(id, nombre) {
    try {
        const respuesta = await fetch(`${API_BASE}/productos/${id}/historial-precios`);
        if (!respuesta.ok) throw new Error('No se pudo cargar el historial');
        const historial = await respuesta.json();
        if (historial.length === 0) {
            alert(`No hay cambios de precio registrados para ${nombre}.`);
            return;
        }
        const texto = historial.map(item => `${item.creado_en} | ₡${item.precio_anterior.toLocaleString('es-CR')} → ₡${item.precio_nuevo.toLocaleString('es-CR')} | ${item.motivo} | ${item.usuario_nombre}`).join('\n');
        alert(`Historial de precios: ${nombre}\n\n${texto}`);
    } catch (error) {
        alert(error.message);
    }
}

async function alternarActivo(id, estadoActual) {
    await fetch(`${API_BASE}/productos/${id}/activo`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ activo: !estadoActual })
    });
    cargarProductos();
}

cargarCategoriasEnSelect();
cargarProductos();
</script>
</body>
</html>
