<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POSLite — Clientes</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="css/estilo.css" rel="stylesheet">
</head>
<body data-pagina="clientes">
<div id="app-nav"></div>
<main class="container-fluid py-4">
    <div class="row g-4">
        <div class="col-12 col-lg-4">
            <div class="panel">
                <h2>Nuevo cliente</h2>
                <form id="form-crear">
                    <div class="mb-2">
                        <label class="form-label" for="c-nombre">Nombre o empresa</label>
                        <input class="form-control" id="c-nombre" required maxlength="120">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="c-telefono">Teléfono (opcional)</label>
                        <input class="form-control" id="c-telefono" maxlength="30">
                    </div>
                    <button class="btn btn-accent w-100" type="submit">Guardar cliente</button>
                    <div class="estado-mensaje mt-2" id="c-estado"></div>
                </form>
            </div>
        </div>
        <div class="col-12 col-lg-8">
            <div class="panel">
                <h2>Clientes guardados</h2>
                <div class="table-responsive">
                    <table class="table">
                        <thead><tr><th>Nombre o empresa</th><th>Teléfono</th></tr></thead>
                        <tbody id="tbody-clientes"></tbody>
                    </table>
                    <div class="vacio d-none" id="tabla-vacia">Aún no hay clientes guardados.</div>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="js/nav.js"></script>
<script>
const API_BASE = '/api';
const estado = document.getElementById('c-estado');

function escaparHtml(valor) {
    return String(valor || '').replace(/[&<>"']/g, caracter => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[caracter]));
}

async function cargarClientes() {
    const tbody = document.getElementById('tbody-clientes');
    const vacio = document.getElementById('tabla-vacia');
    try {
        const respuesta = await fetch(`${API_BASE}/clientes`);
        if (!respuesta.ok) throw new Error('No se pudieron cargar los clientes');
        const clientes = await respuesta.json();
        vacio.classList.toggle('d-none', clientes.length > 0);
        tbody.innerHTML = clientes.map(cliente => `<tr><td>${escaparHtml(cliente.nombre)}</td><td>${escaparHtml(cliente.telefono || '—')}</td></tr>`).join('');
    } catch (error) {
        tbody.innerHTML = `<tr><td colspan="2" class="text-danger">${escaparHtml(error.message)}</td></tr>`;
    }
}

document.getElementById('form-crear').addEventListener('submit', async evento => {
    evento.preventDefault();
    estado.className = 'estado-mensaje mt-2 text-muted';
    estado.textContent = 'Guardando...';
    try {
        const respuesta = await fetch(`${API_BASE}/clientes`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nombre: document.getElementById('c-nombre').value, telefono: document.getElementById('c-telefono').value }) });
        const datos = await respuesta.json();
        if (!respuesta.ok) throw new Error(datos.error || 'No se pudo guardar el cliente');
        estado.className = 'estado-mensaje mt-2 text-success';
        estado.textContent = 'Cliente guardado.';
        setTimeout(() => { estado.textContent = ''; }, 3000);
        document.getElementById('form-crear').reset();
        cargarClientes();
    } catch (error) {
        estado.className = 'estado-mensaje mt-2 text-danger';
        estado.textContent = error.message;
    }
});

cargarClientes();
</script>
</body>
</html>
